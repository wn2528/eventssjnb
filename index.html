<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการกิจกรรม - สสจ.หนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 relative">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="โลโก้" class="h-12 w-12 object-contain" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/9/91/Ministry_of_Public_Health_Thailand_Emblem.svg'">
                <div>
                    <h1 class="text-xl font-bold text-emerald-800">สำนักงานสาธารณสุขจังหวัดหนองบัวลำภู</h1>
                    <p class="text-sm text-slate-500">ระบบรายงานตารางกิจกรรมและแผนการดำเนินงานออนไลน์</p>
                </div>
            </div>
            <!-- ปุ่มเข้าสู่ระบบมุมขวาบน -->
            <button id="btn-login-top" onclick="openLoginModal()" class="flex items-center gap-2 bg-[#1A3668] hover:bg-[#12264A] text-white px-5 py-2.5 rounded-lg font-medium transition shadow-sm">
                เข้าสู่ระบบ (Admin)
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 mt-4">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-slate-800">ตารางกิจกรรมทั้งหมด</h2>
            <button onclick="openEventModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded shadow-sm text-sm font-medium transition">
                + เพิ่มกิจกรรมใหม่
            </button>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 text-sm border-b border-slate-200">
                        <th class="p-4 font-semibold w-1/4">วัน/เวลา</th>
                        <th class="p-4 font-semibold w-1/3">ชื่องาน</th>
                        <th class="p-4 font-semibold">สถานที่</th>
                        <th class="p-4 font-semibold text-center">กลุ่มเป้าหมาย (คน)</th>
                        <th class="p-4 font-semibold">ผู้รับผิดชอบ</th>
                    </tr>
                </thead>
                <tbody id="event-table-body">
                    <tr><td colspan="5" class="p-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- Modal: สำหรับเข้าสู่ระบบ (Login) -->
    <!-- ========================================== -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-[#1A3668]">เข้าสู่ระบบสำหรับเจ้าหน้าที่</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล (Email)</label>
                    <input type="email" id="login-email" required class="w-full border border-slate-300 rounded-md p-2 focus:ring-[#1A3668] focus:border-[#1A3668]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="login-password" required class="w-full border border-slate-300 rounded-md p-2 focus:ring-[#1A3668] focus:border-[#1A3668]">
                </div>
                <div class="pt-4 flex justify-end gap-3">
                    <button type="submit" id="btn-submit-login" class="w-full py-2 bg-[#1A3668] text-white rounded font-medium hover:bg-[#12264A] transition">เข้าสู่ระบบ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- Modal: สำหรับเพิ่มกิจกรรม (ของเดิม) -->
    <!-- ========================================== -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-lg">
                <h3 class="text-xl font-semibold text-emerald-800">บันทึกกิจกรรมใหม่</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            <form id="addEventForm" onsubmit="saveEvent(event)" class="p-6 space-y-4">
                <!-- ข้อมูลฟอร์มเหมือนเดิมทุกอย่าง -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่องาน/โครงการ <span class="text-red-500">*</span></label>
                    <input type="text" id="form-title" required class="w-full border border-slate-300 rounded-md p-2">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">หมวดหมู่ <span class="text-red-500">*</span></label>
                        <select id="form-category" required class="w-full border border-slate-300 rounded-md p-2">
                            <option value="cat_01">ประชุม/สัมมนา</option>
                            <option value="cat_02">ลงพื้นที่/ตรวจเยี่ยม</option>
                            <option value="cat_03">อบรม/พัฒนาบุคลากร</option>
                            <option value="cat_04">รณรงค์/ส่งเสริมสุขภาพ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">กลุ่มงานผู้รับผิดชอบ <span class="text-red-500">*</span></label>
                        <input type="text" id="form-organizer" required placeholder="เช่น กลุ่มงานควบคุมโรคติดต่อ" class="w-full border border-slate-300 rounded-md p-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">วัน-เวลา เริ่มต้น <span class="text-red-500">*</span></label>
                        <input type="datetime-local" id="form-start" required class="w-full border border-slate-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">วัน-เวลา สิ้นสุด <span class="text-red-500">*</span></label>
                        <input type="datetime-local" id="form-end" required class="w-full border border-slate-300 rounded-md p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">สถานที่จัดกิจกรรม <span class="text-red-500">*</span></label>
                    <input type="text" id="form-location" required class="w-full border border-slate-300 rounded-md p-2">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1">กลุ่มเป้าหมาย (รายละเอียด)</label>
                        <input type="text" id="form-audience-desc" class="w-full border border-slate-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">จำนวน (คน)</label>
                        <input type="number" id="form-audience-count" min="0" value="0" class="w-full border border-slate-300 rounded-md p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ</label>
                    <textarea id="form-remarks" rows="2" class="w-full border border-slate-300 rounded-md p-2"></textarea>
                </div>
                <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-50">ยกเลิก</button>
                    <button type="submit" id="btn-submit" class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ------------------------------------------------------------------
        // 1. ตั้งค่า Supabase (ใช้ Key ของเดิม)
        // ------------------------------------------------------------------
        const SUPABASE_URL = 'https://nhkpluvztlqmbcazdzcv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oa3BsdXZ6dGxxbWJjYXpkemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzU5ODksImV4cCI6MjA5NDk1MTk4OX0.K_rawqKNA95gKMPh4LoG-48s9hSlhcNuenOtyjVb8Oo';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ตัวแปรเก็บสถานะล็อกอิน
        let currentUser = null;

        // ------------------------------------------------------------------
        // 2. ตรวจสอบสถานะล็อกอินเมื่อเปิดหน้าเว็บ
        // ------------------------------------------------------------------
        window.onload = async function() {
            // ดึง Session ปัจจุบันจาก Supabase (ถ้าเคยล็อกอินไว้ มันจะจำได้)
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                updateLoginButtonUI(true);
            } else {
                updateLoginButtonUI(false);
            }
            
            loadEvents();
        };

        // ------------------------------------------------------------------
        // 3. ระบบล็อกอินด้วย Email / Password
        // ------------------------------------------------------------------
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-submit-login');
            
            btn.innerHTML = 'กำลังตรวจสอบ...';
            btn.disabled = true;

            // ยิงไปเช็กกับ Supabase Auth
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            btn.innerHTML = 'เข้าสู่ระบบ';
            btn.disabled = false;

            if (error) {
                alert('อีเมลหรือรหัสผ่านไม่ถูกต้องครับ กรุณาลองใหม่');
                console.error(error);
            } else {
                alert('เข้าสู่ระบบสำเร็จ!');
                currentUser = data.user;
                closeLoginModal();
                updateLoginButtonUI(true);
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            currentUser = null;
            alert('ออกจากระบบเรียบร้อยแล้ว');
            updateLoginButtonUI(false);
        }

        function updateLoginButtonUI(isLoggedIn) {
            const loginBtn = document.getElementById('btn-login-top');
            if (!loginBtn) return;

            if (isLoggedIn) {
                loginBtn.innerHTML = 'ออกจากระบบ';
                loginBtn.classList.replace('bg-[#1A3668]', 'bg-red-600');
                loginBtn.classList.replace('hover:bg-[#12264A]', 'hover:bg-red-700');
                loginBtn.onclick = logout;
            } else {
                loginBtn.innerHTML = 'เข้าสู่ระบบ (Admin)';
                loginBtn.classList.replace('bg-red-600', 'bg-[#1A3668]');
                loginBtn.classList.replace('hover:bg-red-700', 'hover:bg-[#12264A]');
                loginBtn.onclick = openLoginModal;
            }
        }

        // ------------------------------------------------------------------
        // 4. ระบบเปิด-ปิด ฟอร์มเพิ่มกิจกรรม
        // ------------------------------------------------------------------
        function openEventModal() {
            if (!currentUser) {
                alert('กรุณาเข้าสู่ระบบก่อนเพิ่มกิจกรรมครับ');
                openLoginModal(); // ถ้ายังไม่ล็อกอิน ให้เด้งหน้าต่างล็อกอินขึ้นมา
            } else {
                document.getElementById('eventModal').classList.remove('hidden');
            }
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('addEventForm').reset();
        }

        // ------------------------------------------------------------------
        // 5. โหลดและบันทึกข้อมูลตาราง (เหมือนเดิม)
        // ------------------------------------------------------------------
        function formatThaiDate(isoString) {
            const date = new Date(isoString);
            const dateStr = date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
            return { dateStr, timeStr };
        }

        async function loadEvents() {
            const tableBody = document.getElementById('event-table-body');
            try {
                let { data: events, error } = await _supabase.from('events').select('*').order('start_datetime', { ascending: true });
                if (error) throw error;

                if (!events || events.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">ยังไม่มีกิจกรรมในระบบ</td></tr>`;
                    return;
                }

                tableBody.innerHTML = ''; 
                events.forEach(event => {
                    const timeInfo = formatThaiDate(event.start_datetime);
                    const endTimeInfo = formatThaiDate(event.end_datetime);
                    
                    const rowHTML = `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                            <td class="p-4 text-sm">
                                <div class="font-medium text-slate-800">${timeInfo.dateStr}</div>
                                <div class="text-slate-500 text-xs">${timeInfo.timeStr} - ${endTimeInfo.timeStr}</div>
                            </td>
                            <td class="p-4 text-sm font-medium text-emerald-800">
                                ${event.title}
                                ${event.remarks ? `<div class="text-xs text-amber-600 mt-1 font-normal">หมายเหตุ: ${event.remarks}</div>` : ''}
                            </td>
                            <td class="p-4 text-sm text-slate-600">${event.location}</td>
                            <td class="p-4 text-sm text-center">
                                <div class="text-slate-800 font-medium">${event.target_count}</div>
                            </td>
                            <td class="p-4 text-sm text-slate-600">${event.organizer}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += rowHTML;
                });
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
            }
        }

        async function saveEvent(e) {
            e.preventDefault(); 
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerHTML = 'กำลังบันทึก...';
            btnSubmit.disabled = true;

            const newEvent = {
                event_id: 'EVT-' + Date.now(),
                title: document.getElementById('form-title').value,
                category_id: document.getElementById('form-category').value,
                start_datetime: new Date(document.getElementById('form-start').value).toISOString(),
                end_datetime: new Date(document.getElementById('form-end').value).toISOString(),
                location: document.getElementById('form-location').value,
                target_audience_desc: document.getElementById('form-audience-desc').value,
                target_count: parseInt(document.getElementById('form-audience-count').value),
                organizer: document.getElementById('form-organizer').value,
                remarks: document.getElementById('form-remarks').value,
                created_by: currentUser.email, // บันทึกว่าใครเป็นคนสร้าง
                status: 'confirmed'
            };

            try {
                const { error } = await _supabase.from('events').insert([newEvent]);
                if (error) throw error;

                alert('บันทึกข้อมูลกิจกรรมสำเร็จ!');
                closeEventModal();
                loadEvents(); 
                
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
            } finally {
                btnSubmit.innerHTML = 'บันทึกข้อมูล';
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
